name: CVE Alert Bot

permissions:
  contents: write

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0                # full history so we can pull/rebase safely
        persist-credentials: true
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Ensure data files exist
      run: |
        [ -f last_seen.json ] || echo "[]" > last_seen.json
        [ -f subscribers.json ] || echo "[]" > subscribers.json

    - name: Run bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      run: python bot.py

    - name: Commit updated files (fetch, reconcile, push)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Stage bot-generated files (no-op if missing)
        git add last_seen.json subscribers.json || true

        # If nothing staged, nothing to do
        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        # Commit local changes
        git commit -m "Update CVE and subscriber data [bot]"

        # Determine current branch in a robust way
        BRANCH="$(git rev-parse --abbrev-ref HEAD 2>/dev/null || true)"
        if [ -z "$BRANCH" ] || [ "$BRANCH" = "HEAD" ]; then
          # fallback to GITHUB_REF if HEAD is detached
          BRANCH="${GITHUB_REF#refs/heads/}"
        fi
        echo "Branch detected: $BRANCH"

        # Ensure we have remote data
        git fetch origin "$BRANCH" --depth=1 || git fetch origin

        # Try to rebase local commit(s) on top of remote branch
        if git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
          if git rebase origin/"$BRANCH"; then
            echo "Rebase successful"
          else
            echo "Rebase failed — aborting rebase and trying merge"
            git rebase --abort 2>/dev/null || true
            # Try a non-fast-forward merge (keeps both changes)
            if git merge --no-edit origin/"$BRANCH"; then
              echo "Merge of origin/$BRANCH successful"
            else
              echo "Merge failed; continuing to push attempts"
            fi
          fi
        else
          echo "No origin/$BRANCH to rebase against (new branch), proceeding to push"
        fi

        # Try normal push first
        if git push origin "$BRANCH"; then
          echo "Push succeeded"
          exit 0
        fi

        # If normal push failed due to non-fast-forward, try safe forced push
        echo "Normal push failed; attempting safe force push (--force-with-lease)"
        if git push --force-with-lease origin "$BRANCH"; then
          echo "Push with --force-with-lease succeeded"
          exit 0
        fi

        # Final fallback diagnostics (do not fail the workflow)
        echo "Push failed; remote may contain new commits, branch protection may block pushes, or GITHUB_TOKEN lacks write permissions."
        echo "Remote refs for branch:"
        git ls-remote origin "$BRANCH" || true
        exit 0
